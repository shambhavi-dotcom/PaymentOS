version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: paymentos-postgres
    environment:
      POSTGRES_DB: paymentos
      POSTGRES_USER: paymentos
      POSTGRES_PASSWORD: paymentos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymentos -d paymentos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: paymentos-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paymentos
      SPRING_DATASOURCE_USERNAME: paymentos
      SPRING_DATASOURCE_PASSWORD: paymentos
      SPRING_PROFILES_ACTIVE: docker

volumes:
  postgres_data:
